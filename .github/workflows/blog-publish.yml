name: Blog Pipeline - Publish

on:
  schedule:
    # Tuesday and Friday at 9am UTC
    - cron: '0 9 * * 2,5'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish stage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/blog-pipeline.mjs publish

      - name: Commit and push
        id: commit
        run: |
          git config user.name "Kira (Blog Pipeline)"
          git config user.email "kira@klinchapp.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "blog: publish post"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Syndicate to Blogger
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: node scripts/syndicate-to-blogger.mjs
