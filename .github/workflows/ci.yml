name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    env:
      # Placeholder values — the build needs these to be non-empty so the
      # Supabase SDK initialises during prerendering, but no real network
      # calls are made at build time. Real secrets stay in Vercel only.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ANTHROPIC_API_KEY: placeholder
      RESEND_API_KEY: placeholder
      NEXT_PUBLIC_APP_URL: https://www.klinchapp.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit
